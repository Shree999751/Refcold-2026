<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Health Overview Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f8f9fa;
            color: #333;
        }

        /* Sidebar Styles */
        aside {
            width: 240px;
            background-color: #114b5f;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
        }

        .nav-item {
            padding: 15px 25px;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            color: #f7931e;
            font-weight: 600;
        }

        /* Main Content Styles */
        main {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
        }

        h1 {
            font-size: 24px;
            color: #0b3c5d;
            margin-bottom: 25px;
        }

        /* Fleet Health Score Section */
        .score-section {
            margin-bottom: 25px;
        }

        .score-label {
            font-size: 15px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .score-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .progress-bar-bg {
            flex: 1;
            max-width: 650px;
            height: 24px;
            background-color: #e5edf1;
            border-radius: 4px;
            overflow: hidden;
            padding: 3px;
        }

        .progress-bar-fill {
            width: 92%;
            height: 100%;
            background-color: #2b7a0b;
            border-radius: 2px;
        }

        .score-value {
            font-size: 18px;
            font-weight: 700;
            color: #2b7a0b;
        }

        /* Chart Box */
        .chart-box {
            background: #ffffff;
            border: 1px solid #d1dede;
            border-radius: 4px;
            padding: 15px 20px;
            height: 160px;
            margin-bottom: 30px;
            position: relative;
        }

        .chart-title {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }

        /* CSS-drawn line representation matching the trend line */
        .chart-line {
            width: 100%;
            height: 80px;
            position: relative;
            margin-top: 15px;
        }

        .chart-line svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Active Alerts Section */
        h2 {
            font-size: 18px;
            color: #0b3c5d;
            margin-bottom: 15px;
        }

        .alert-card {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .alert-id {
            font-weight: 700;
            width: 100px;
        }

        .alert-msg {
            flex: 1;
        }

        /* Alert Variants */
        .alert-red {
            background-color: #fdf2f0;
            border: 1px solid #f9d8d4;
        }
        .alert-red .alert-id {
            color: #b33912;
        }
        .alert-red .alert-msg {
            color: #b33912;
        }

        .alert-yellow {
            background-color: #fcf8e8;
            border: 1px solid #f5e9bd;
        }
        .alert-yellow .alert-id {
            color: #b38600;
        }
        .alert-yellow .alert-msg {
            color: #9c7500;
        }

        .alert-green {
            background-color: #edf7ed;
            border: 1px solid #d4edda;
        }
        .alert-green .alert-id {
            color: #1e7e34;
        }
        .alert-green .alert-msg {
            color: #155724;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside>
        <a href="#" class="nav-item active">Overview</a>
        <a href="#" class="nav-item">Units</a>
        <a href="#" class="nav-item">Alerts</a>
        <a href="#" class="nav-item">Settings</a>
    </aside>

    <!-- Main Dashboard Area -->
    <main>
        <h1>Fleet Health Overview</h1>

        <!-- Fleet Health Score -->
        <div class="score-section">
            <div class="score-label">Fleet Health Score</div>
            <div class="score-container">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill"></div>
                </div>
                <div class="score-value">92 / 100</div>
            </div>
        </div>

        <!-- Superheat Trend Chart Box -->
        <div class="chart-box">
            <div class="chart-title">Superheat trend, Unit CU-114 (last 14 days)</div>
            <div class="chart-line">
                <svg viewBox="0 0 600 50" preserveAspectRatio="none">
                    <!-- Smooth zigzag trending down line mimicking the chart -->
                    <polyline fill="none" stroke="#ff6b4a" stroke-width="2.5" 
                        points="0,10 50,15 100,12 150,18 200,22 250,23 300,26 350,28 400,30 450,32 500,33 550,36 600,38" />
                </svg>
            </div>
        </div>

        <!-- Active Alerts -->
        <h2>Active Alerts</h2>

        <!-- Alert 1: Red -->
        <div class="alert-card alert-red">
            <div class="alert-id">CU-114</div>
            <div class="alert-msg">Floodback risk, ~2 days lead time</div>
        </div>

        <!-- Alert 2: Yellow -->
        <div class="alert-card alert-yellow">
            <div class="alert-id">CU-098</div>
            <div class="alert-msg">Oil pressure drifting, monitor</div>
        </div>

        <!-- Alert 3: Green -->
        <div class="alert-card alert-green">
            <div class="alert-id">CU-071</div>
            <div class="alert-msg">Nominal, last checked 4h ago</div>
        </div>
    </main>

</body>
</html>
